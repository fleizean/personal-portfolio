# Proje adi dizin adindan bagimsiz sabit: container ismi her makinede ayni olsun.
name: personal-portfolio

services:
  web:
    # Uretimde imaj GitHub Actions'ta derlenip GHCR'a gonderilir, sunucu sadece ceker:
    #   IMAGE_TAG=<sha> docker compose pull && docker compose up -d
    # Yerelde denemek icin: docker compose up -d --build
    image: ghcr.io/fleizean/personal-portfolio:${IMAGE_TAG:-latest}
    build: ./frontend
    restart: unless-stopped
    ports:
      # Sadece localhost'a ac: TLS'i sunucudaki nginx yapiyor.
      - '127.0.0.1:${WEB_PORT:-8083}:3000'
    healthcheck:
      # Angular SSR yalnizca izinli host adlarina yanit verir
      test: ['CMD-SHELL', "wget -q -O /dev/null --header='Host: fleizean.dev' http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # .NET API. Disariya port acmaz; web servisi ileride docker agi icinden http://api:8080 ile erisir.
  api:
    image: ghcr.io/fleizean/personal-portfolio-api:${IMAGE_TAG:-latest}
    build: ./backend
    restart: unless-stopped
    environment:
      # Sifre yalnizca sunucudaki .env dosyasinda durur; yoksa compose bilerek hata verir.
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-portfolio};Username=${POSTGRES_USER:-portfolio};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimli olmali}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - database
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  db:
    image: postgres:19-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimli olmali}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    volumes:
      - db_data:/var/lib/postgresql
    # Yalnizca API'nin bulundugu ic agda; host'a ve internete kapali.
    networks:
      - database
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  database:
    internal: true

volumes:
  db_data:
