<!-- Sistem menüsü -->
<div class="relative" data-system-menu>
  <button
    type="button"
    class="panel-button"
    [class.panel-button--active]="menuOpen()"
    [attr.aria-label]="i18n.t('os.menu.applications')"
    [attr.aria-expanded]="menuOpen()"
    [title]="i18n.t('os.menu.applications')"
    (click)="menuOpen.set(!menuOpen())"
  >
    <span
      aria-hidden="true"
      class="os-mono inline-flex h-[22px] w-[22px] items-center justify-center rounded-[5px] bg-gradient-to-br from-[#4c9bff] to-[#6b4dff] text-[14px] font-bold leading-none text-white"
      >f</span
    >
  </button>

  @if (menuOpen()) {
    <ul
      role="menu"
      class="absolute left-0 top-full mt-1 w-56 overflow-hidden rounded-md border border-slate-300 bg-[#f6f7f9] py-1 shadow-xl dark:border-[#3a3f4b] dark:bg-[#22252c]"
    >
      <li class="px-3 pb-1 pt-0.5 text-xs font-bold text-slate-500 dark:text-slate-400">
        {{ i18n.t('os.menu.applications') }}
      </li>
      @for (entry of menu(); track entry.label) {
        <li role="none">
          <button
            type="button"
            role="menuitem"
            class="flex w-full items-center gap-2.5 px-3 py-1.5 text-left hover:bg-[#367bf0] hover:text-white"
            (click)="select(entry)"
          >
            <app-node-icon [kind]="entry.kind" [glyph]="entry.glyph" [size]="18" />
            {{ entry.label }}
          </button>
        </li>
      }
    </ul>
  }
</div>

<span class="panel-separator" aria-hidden="true"></span>

<!-- Hızlı başlatıcılar -->
<div class="hidden items-center sm:flex">
  @for (entry of launchers(); track entry.label) {
    <button
      type="button"
      class="panel-button"
      [attr.aria-label]="entry.label"
      [title]="entry.label"
      (click)="entry.select()"
    >
      <app-node-icon [kind]="entry.kind" [glyph]="entry.glyph" [size]="18" />
    </button>
  }
  <span class="panel-separator" aria-hidden="true"></span>
</div>

<!-- Çalışma alanları -->
<nav class="hidden items-center sm:flex" [attr.aria-label]="i18n.t('os.panel.workspace')">
  @for (n of workspaces; track n) {
    <button
      type="button"
      class="relative h-[34px] w-8 hover:bg-black/5 dark:hover:bg-white/10"
      [class]="
        store.workspace() === n
          ? 'font-bold text-slate-900 dark:text-white'
          : 'text-slate-500 dark:text-slate-400'
      "
      [attr.aria-label]="i18n.t('os.panel.workspace') + ' ' + n"
      [attr.aria-current]="store.workspace() === n"
      (click)="store.workspace.set(n)"
    >
      {{ n }}
      @if (store.workspace() === n) {
        <span class="absolute inset-x-1 bottom-0 h-[2px] bg-[#367bf0]"></span>
      }
    </button>
  }
  <span class="panel-separator" aria-hidden="true"></span>
</nav>

<!-- Açık pencereler -->
<div class="flex min-w-0 flex-1 items-center gap-0.5 overflow-hidden">
  @for (win of store.windows(); track win.id) {
    <button
      type="button"
      class="flex h-[28px] min-w-0 max-w-44 items-center gap-1.5 rounded px-2"
      [class]="
        store.focusedId() === win.id && !win.minimized
          ? 'bg-black/10 dark:bg-white/15'
          : 'hover:bg-black/5 dark:hover:bg-white/10'
      "
      [class.opacity-60]="win.minimized"
      [title]="win.title"
      (click)="store.toggleFromTaskbar(win.id)"
    >
      <app-node-icon [kind]="win.content.app === 'files' ? 'dir' : 'file'" [glyph]="win.glyph" [size]="16" />
      <span class="hidden truncate md:inline">{{ win.title }}</span>
    </button>
  }
</div>

<!-- Sistem tepsisi -->
<button
  type="button"
  class="panel-button"
  [attr.aria-label]="i18n.t('os.panel.language')"
  [title]="i18n.t('os.panel.language')"
  (click)="i18n.toggle()"
>
  <span class="os-mono text-xs font-bold uppercase">{{ i18n.language() }}</span>
</button>
<button
  type="button"
  class="panel-button"
  [attr.aria-label]="i18n.t('os.panel.theme')"
  [title]="i18n.t('os.panel.theme')"
  (click)="theme.toggle()"
>
  <svg lucideMoon class="h-4 w-4 dark:hidden"></svg>
  <svg lucideSun class="hidden h-4 w-4 dark:block"></svg>
</button>
<span class="panel-separator" aria-hidden="true"></span>
<time class="os-mono min-w-[44px] px-2 text-center text-xs tabular-nums" [title]="date()">
  {{ time() }}
</time>
