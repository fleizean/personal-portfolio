@switch (variant()) {
  @case ('trash') {
    <svg
      [lucideIcon]="trashIcon"
      class="absolute inset-[10%] h-[80%] w-[80%] text-slate-100 drop-shadow"
      [strokeWidth]="1.6"
    ></svg>
  }
  @case ('app') {
    <span
      class="absolute inset-[8%] flex items-center justify-center rounded-[22%] shadow-md ring-1 ring-white/15"
      [style.background]="appBackground()"
    >
      @if (inner(); as icon) {
        <svg [lucideIcon]="icon" class="h-[55%] w-[55%] text-white" [strokeWidth]="2"></svg>
      }
    </span>
  }
  @case ('dir') {
    <svg viewBox="0 0 48 48" class="h-full w-full">
      <defs>
        <linearGradient id="os-folder-front" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4c9bff" />
          <stop offset="1" stop-color="#2a6ae6" />
        </linearGradient>
      </defs>
      <path
        d="M4 10.5A2.5 2.5 0 0 1 6.5 8h11.2l3.6 3.6H41.5A2.5 2.5 0 0 1 44 14.1V18H4z"
        fill="#1f56c4"
      />
      <rect x="4" y="14" width="40" height="27" rx="2.5" fill="url(#os-folder-front)" />
      <rect x="4" y="14" width="40" height="1.5" fill="#ffffff" opacity="0.25" />
    </svg>
    @if (inner(); as icon) {
      <svg
        [lucideIcon]="icon"
        class="absolute left-1/2 top-[44%] h-[32%] w-[32%] -translate-x-1/2 text-white"
        [strokeWidth]="2.4"
      ></svg>
    }
  }
  @default {
    <svg viewBox="0 0 48 48" class="h-full w-full">
      <path d="M11 4h18l10 10v28a2 2 0 0 1-2 2H11a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="#f4f6fa" />
      <path d="M29 4v8a2 2 0 0 0 2 2h8z" fill="#cfd5e2" />
      <rect x="9" y="33" width="30" height="9" [attr.fill]="accent()" />
      <path d="M9 42h30a2 2 0 0 1-2 2H11a2 2 0 0 1-2-2z" [attr.fill]="accent()" />
    </svg>
    @if (glyph() === 'pdf') {
      <span
        class="absolute inset-x-0 top-[69%] text-center font-bold leading-none text-white"
        [style.font-size.px]="size() * 0.15"
        >PDF</span
      >
    } @else if (inner(); as icon) {
      <svg
        [lucideIcon]="icon"
        class="absolute left-1/2 top-[30%] h-[30%] w-[30%] -translate-x-1/2"
        [color]="accent()"
        [strokeWidth]="2.2"
      ></svg>
    }
  }
}
