@let p = profile();
<div class="flex flex-col-reverse gap-6 sm:flex-row sm:items-start">
  <div class="min-w-0 flex-1">
    <h1 class="text-2xl font-bold text-slate-900 sm:text-3xl dark:text-white">
      <span class="os-mono text-[#367bf0]"># </span>{{ p.greeting }}
    </h1>
    <p class="mt-2 text-base sm:text-lg">
      {{ p.role }}
      <a
        class="text-[#367bf0] hover:underline"
        target="_blank"
        rel="noopener noreferrer"
        [href]="linkedinUrl()"
        >[{{ p.company }}]</a
      >
    </p>
    <p class="mt-4 text-sm leading-relaxed lowercase">{{ p.description }}</p>

    <ul class="os-mono mt-5 flex flex-wrap gap-x-4 gap-y-2 text-[13px]">
      @for (social of p.socials; track social.url) {
        <li>
          <a
            class="flex items-center gap-1.5 hover:text-[#367bf0]"
            target="_blank"
            rel="noopener noreferrer"
            [href]="social.url"
            [attr.aria-label]="i18n.t('social.' + social.kind)"
          >
            <app-brand-icon class="h-4 w-4" [kind]="social.kind" />
            <span>{{ social.label }}</span>
          </a>
        </li>
      }
    </ul>

    <div class="os-mono mt-6 flex flex-wrap items-center gap-3 text-[13px]">
      <button type="button" class="group" (click)="openCv.emit()">
        <span class="bracket">[</span
        ><span class="group-hover:text-[#367bf0]">{{ i18n.t('actions.resume') }}</span
        ><span class="bracket">]</span>
      </button>
      <span class="bracket">──</span>
      <button type="button" class="group" (click)="openContact.emit()">
        <span class="bracket">[</span
        ><span class="group-hover:text-[#367bf0]">{{ i18n.t('actions.contact') }}</span
        ><span class="bracket">]</span>
      </button>
    </div>
  </div>

  <div
    class="relative mx-auto h-40 w-40 shrink-0 overflow-hidden border-4 border-white shadow-lg sm:mx-0 sm:h-48 sm:w-48 dark:border-slate-200"
  >
    <img [ngSrc]="portrait()" [alt]="p.portraitAlt" fill sizes="192px" priority class="object-cover dark:brightness-90" />
  </div>
</div>
