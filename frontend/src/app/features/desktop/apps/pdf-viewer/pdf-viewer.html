<div class="flex shrink-0 items-center gap-1 px-2 pb-2">
  <a class="tool-link" target="_blank" rel="noopener noreferrer" [href]="src()">
    <svg lucideExternalLink class="h-4 w-4"></svg>
    {{ i18n.t('os.pdf.open') }}
  </a>
  <a class="tool-link" download [href]="src()">
    <svg lucideDownload class="h-4 w-4"></svg>
    {{ i18n.t('os.pdf.download') }}
  </a>
</div>
<iframe
  title="cv.pdf"
  class="min-h-0 w-full flex-1 border-t border-slate-300 bg-[#525659] dark:border-[#2e323a]"
  [src]="safeSrc()"
></iframe>
