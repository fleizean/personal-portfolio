# Yalnızca güvenlik güncellemeleri.
#
# Sürüm güncellemeleri kapalı (open-pull-requests-limit: 0): Dependabot "yeni sürüm çıktı"
# diye PR açmaz. Bir bağımlılıkta güvenlik açığı bildirildiğinde ise (repo ayarlarında
# Dependabot security updates açık olmalı) düzeltme PR'ı açar; aynı ekosistemdeki tüm
# güvenlik yamaları tek PR'da toplanır. PR'lar ci.yml ile test edilir.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: docker
    directories: [/frontend, /backend]
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
