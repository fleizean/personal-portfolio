# Bağımlılık güncellemeleri ve güvenlik yamaları için haftalık PR'lar.
# PR'lar ci.yml ile test edilir; main'e birleşince deploy.yml yayına alır.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*']

  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      efcore:
        patterns: ['Microsoft.EntityFrameworkCore*', 'Npgsql.*', 'EFCore.*']

  - package-ecosystem: docker
    directories: [/frontend, /backend]
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
