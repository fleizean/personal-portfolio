name: CI

# Pull request'leri (Dependabot dahil) yayına almadan test eder.
# Repo public: bu iş hiçbir secret kullanmaz ve yalnızca okuma izniyle çalışır,
# bu yüzden fork'lardan gelen PR'lar için de güvenlidir.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: backend/global.json

      - name: Test
        working-directory: backend
        run: dotnet test --solution Portfolio.slnx -c Release

  frontend:
    name: Frontend derleme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Derle (tip ve şablon kontrolleri dahil)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm run build
