# fleizean.dev — host nginx vhost (TLS burada sonlanir, uygulama docker'da 127.0.0.1:8083)
#
#   sudo cp deploy/fleizean.dev.conf /etc/nginx/sites-available/fleizean.dev
#   sudo ln -s /etc/nginx/sites-available/fleizean.dev /etc/nginx/sites-enabled/fleizean.dev
#   sudo nginx -t && sudo systemctl reload nginx

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;

    server_name fleizean.dev www.fleizean.dev;

    return 301 https://fleizean.dev$request_uri;
}

# www -> apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.fleizean.dev;

    ssl_certificate     /etc/letsencrypt/live/fleizean.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fleizean.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://fleizean.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name fleizean.dev;

    ssl_certificate     /etc/letsencrypt/live/fleizean.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fleizean.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/fleizean.dev.access.log;
    error_log  /var/log/nginx/fleizean.dev.error.log;

    # Form/yukleme yok; govde boyutunu kucuk tut
    client_max_body_size 1m;

    # Guvenlik basliklari
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        # docker-compose "web" servisi (WEB_PORT), sadece 127.0.0.1 e bagli
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
